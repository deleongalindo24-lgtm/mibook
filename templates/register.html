<!DOCTYPE html>
<html>
<head>
    <title>ZENTRI - Registro</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
        }

        h2 {
            text-align: center;
            color: green;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        .btn:focus {
            outline: none;
            background: green;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Crear cuenta ZENTRI</h2>

    <form method="POST">
        <input name="name" placeholder="Nombre">
        <input name="email" placeholder="Correo">
        <input name="password" type="password" placeholder="Contraseña">

        <button class="btn">Registrarse</button>
    </form>
</div>

</body>
</html>
