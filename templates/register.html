<!DOCTYPE html>
<html>
<head>
    <title>Zentri - Crear cuenta</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            display: flex;
            align-items: center;
            gap: 60px;
        }

        /* LOGO */
        .logo-box {
            max-width: 300px;
        }

        .logo {
            font-size: 60px;
            font-weight: bold;
            color: #1877f2;
            letter-spacing: -2px;
        }

        .tagline {
            font-size: 20px;
            color: #1c1e21;
            margin-top: 10px;
        }

        /* FORM CARD */
        .card {
            background: white;
            padding: 20px;
            width: 340px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #1877f2;
        }

        .btn-create {
            width: 100%;
            padding: 12px;
            background: #42b72a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn-create:hover {
            background: #36a420;
        }

        .btn-create:active {
            transform: scale(0.98);
        }

        .login-link {
            display: block;
            margin-top: 15px;
            color: #1877f2;
            text-decoration: none;
            font-size: 14px;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        button, a {
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        button:focus, a:focus {
            outline: none;
            box-shadow: none;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LOGO -->
    <div class="logo-box">
        <div class="logo">Zentri</div>
        <div class="tagline">Crea una cuenta y conecta con personas en Zentri.</div>
    </div>

    <!-- FORM -->
    <div class="card">

        <h2>Crear cuenta</h2>

        <form method="POST">
            <input name="name" placeholder="Nombre completo" required>
            <input name="email" placeholder="Correo electrónico" required>
            <input name="password" type="password" placeholder="Contraseña" required>

            <button class="btn-create" type="submit">Registrarte</button>
        </form>

        <a class="login-link" href="/login">¿Ya tienes cuenta? Inicia sesión</a>

    </div>

</div>

</body>
</html>
