<!DOCTYPE html>
<html>
<head>
    <title>Zentri - Login</title>
    <style>
        body{
            font-family: Arial;
            background: #f0f2f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:white;
            padding:30px;
            border-radius:12px;
            width:320px;
            box-shadow:0px 4px 15px rgba(0,0,0,0.1);
            text-align:center;
        }

        h1{
            color:#1877f2;
            font-size:32px;
            margin-bottom:10px;
        }

        input{
            width:100%;
            padding:12px;
            margin:8px 0;
            border:1px solid #ddd;
            border-radius:8px;
        }

        .btn-login{
            width:100%;
            padding:12px;
            background:#1877f2;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
            margin-top:8px;
        }

        .btn-login:hover{
            background:#145ec9;
        }

        .btn-register{
            width:100%;
            padding:12px;
            background:#42b72a;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
            margin-top:10px;
        }

        .btn-register:hover{
            background:#36a420;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>ZENTRI</h1>

    <form method="POST">
        <input name="email" placeholder="Correo">
        <input name="password" type="password" placeholder="Contraseña">

        <button class="btn-login" type="submit">Iniciar sesión</button>
    </form>

    <!-- 🔥 BOTÓN NUEVO VERDE -->
    <form action="/register">
        <button class="btn-register" type="submit">Crear cuenta nueva</button>
    </form>

</div>

</body>
</html>
