<!DOCTYPE html>
<html>
<head>
    <title>ZENTRI - Login</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #1877f2;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        .btn-login {
            width: 100%;
            padding: 10px;
            background: #1877f2;
            color: white;
            border: none;
            cursor: pointer;
        }

        .btn-register {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            margin-top: 10px;
            cursor: pointer;
        }

        .btn-login:focus,
        .btn-register:focus {
            outline: none;
            background: inherit;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>ZENTRI</h2>

    <form method="POST">
        <input name="email" placeholder="Correo">
        <input name="password" type="password" placeholder="Contraseña">

        <button class="btn-login">Iniciar sesión</button>
    </form>

    <form action="/register">
        <button class="btn-register">Crear cuenta</button>
    </form>
</div>

</body>
</html>
