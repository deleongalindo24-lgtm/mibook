<!DOCTYPE html>
<html>
<head>
    <title>Zentri - Login</title>
    <style>
        body{
            font-family: Arial;
            background: #f0f2f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:white;
            padding:30px;
            border-radius:12px;
            width:320px;
            box-shadow:0px 4px 15px rgba(0,0,0,0.1);
            text-align:center;
        }

        h1{
            color:#1877f2;
            font-size:32px;
            margin-bottom:10px;
        }

        input{
            width:100%;
            padding:12px;
            margin:8px 0;
            border:1px solid #ddd;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            background:#1877f2;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
        }

        button:hover{
            background:#145ec9;
        }

        a{
            display:block;
            margin-top:10px;
            color:#1877f2;
            text-decoration:none;
        }
    </style>
</head>

<body>
<div class="box">
    <h1>ZENTRI</h1>

    <form method="POST">
        <input name="email" placeholder="Correo">
        <input name="password" type="password" placeholder="Contraseña">

        <button type="submit">Iniciar sesión</button>
    </form>

    <a href="/register">Crear cuenta nueva</a>
</div>
</body>
</html>
