<!DOCTYPE html>
<html>
<head>
    <title>Zentri - Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            display: flex;
            align-items: center;
            gap: 60px;
            flex-wrap: wrap;
        }

        /* LOGO */
        .logo-box {
            max-width: 320px;
        }

        .logo {
            font-size: 60px;
            font-weight: bold;
            color: #1877f2;
            letter-spacing: -2px;
        }

        .tagline {
            font-size: 20px;
            color: #1c1e21;
            margin-top: 10px;
        }

        /* FORM CARD */
        .card {
            background: white;
            padding: 20px;
            width: 340px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #1877f2;
        }

        /* BOTÓN LOGIN */
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn-login:hover {
            background: #166fe5;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        /* BOTÓN CREAR CUENTA */
        .btn-register {
            display: block;
            width: 100%;
            padding: 12px;
            background: #42b72a;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn-register:hover {
            background: #36a420;
        }

        .btn-register:active {
            transform: scale(0.98);
        }

        /* quitar efectos raros al click */
        button, a {
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        button:focus, a:focus {
            outline: none;
            box-shadow: none;
        }

        /* móvil */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                text-align: center;
            }

            .logo {
                font-size: 50px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LOGO -->
    <div class="logo-box">
        <div class="logo">Zentri</div>
        <div class="tagline">Conecta con personas en Zentri.</div>
    </div>

    <!-- FORM -->
    <div class="card">

        <h2>Iniciar sesión</h2>

        <form method="POST">
            <input name="email" placeholder="Correo electrónico" required>
            <input name="password" type="password" placeholder="Contraseña" required>

            <button class="btn-login" type="submit">Entrar</button>
        </form>

        <a class="btn-register" href="/register">Crear cuenta nueva</a>

    </div>

</div>

</body>
</html>
