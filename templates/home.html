<h1>ZENTRI</h1>

<p>Bienvenido {{ user }}</p>

<form method="POST" action="/post">
    <input name="content" placeholder="¿Qué estás pensando?">
    <button>Publicar</button>
</form>

<hr>

{% for post in posts %}
    <div>
        <h4>{{ post[1] }}</h4>
        <p>{{ post[2] }}</p>
        <p>❤️ {{ post[3] }}</p>

        <a href="/like/{{ post[0] }}">Like</a>
    </div>
    <hr>
{% endfor %}

<a href="/logout">Salir</a>
