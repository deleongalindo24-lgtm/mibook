<!DOCTYPE html>
<html>
<head>
    <title>Zentri</title>
</head>
<body>

<h1>Bienvenido {{ user }}</h1>

<a href="/logout">Salir</a>

<form method="POST" action="/post">
    <textarea name="content" placeholder="¿Qué estás pensando?"></textarea>
    <button>Publicar</button>
</form>

<hr>

{% for post in posts %}
    <div>
        <h3>{{ post[1] }}</h3>
        <p>{{ post[2] }}</p>
        <p>❤️ {{ post[3] }} likes</p>

        <a href="/like/{{ post[0] }}">Like</a>

        <form method="POST" action="/comment/{{ post[0] }}">
            <input name="comment" placeholder="Comentario">
        </form>
    </div>
    <hr>
{% endfor %}

</body>
</html>
