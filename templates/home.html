<!DOCTYPE html>
<html>
<head>
    <title>MiBook</title>
    <style>
        body{
            font-family:Arial;
            background:#f0f2f5;
        }

        .topbar{
            background:#1877f2;
            color:white;
            padding:15px;
            font-size:22px;
        }

        .container{
            width:600px;
            margin:20px auto;
        }

        .card{
            background:white;
            padding:15px;
            border-radius:10px;
            margin-bottom:10px;
        }

        textarea{
            width:100%;
            padding:10px;
        }

        button{
            background:#1877f2;
            color:white;
            border:none;
            padding:10px;
            margin-top:5px;
        }
    </style>
</head>
<body>

<div class="topbar">
    Bienvenido {{ user }}
</div>

<div class="container">

    <div class="card">
        <h3>Crear publicación</h3>
        <textarea placeholder="¿Qué estás pensando?"></textarea>
        <button>Publicar</button>
    </div>

</div>

</body>
</html>
