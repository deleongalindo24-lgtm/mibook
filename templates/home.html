<!DOCTYPE html>
<html>
<head>
    <title>Zentri - Home</title>

    <style>
        body {
            font-family: Arial;
            background: #f3f4f6;
            margin: 0;
        }

        .header {
            background: #1e40af;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            width: 500px;
            margin: auto;
            margin-top: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }

        .post-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
            background: #1e40af;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #3b82f6;
        }

        .logout {
            text-align: center;
            margin-top: 20px;
        }

        .logout a {
            color: red;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="header">Zentri</div>

<div class="container">

    <div class="post-box">
        <form method="POST" action="/post">
            <input name="content" placeholder="¿Qué estás pensando?" required>
            <button>Publicar</button>
        </form>
    </div>

    {% for post in posts %}
    <div class="card">
        <b>{{ post[0] }}</b>
        <p>{{ post[1] }}</p>
    </div>
    {% endfor %}

    <div class="logout">
        <a href="/logout">Cerrar sesión</a>
    </div>

</div>

</body>
</html>
