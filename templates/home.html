<!DOCTYPE html>
<html>
<head>
    <title>ZENTRI - Home</title>
    <style>
        body{
            font-family: Arial;
            background:#f0f2f5;
            margin:0;
        }

        .header{
            background:white;
            padding:15px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow:0 2px 5px rgba(0,0,0,0.1);
        }

        .logo{
            font-size:22px;
            font-weight:bold;
            color:#1877f2;
        }

        .btn-logout{
            background:red;
            color:white;
            padding:8px 12px;
            border-radius:5px;
            text-decoration:none;
        }

        .container{
            width:600px;
            margin:20px auto;
        }

        .card{
            background:white;
            padding:15px;
            margin-bottom:15px;
            border-radius:10px;
            box-shadow:0 2px 5px rgba(0,0,0,0.1);
        }

        .btn{
            padding:8px 10px;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        .like{background:#1877f2;color:white;}
        .delete{background:red;color:white;}
        .comment{background:#42b72a;color:white;}

        input, textarea{
            width:100%;
            padding:8px;
            margin-top:5px;
            margin-bottom:10px;
        }

        a{
            text-decoration:none;
        }

        .top-links{
            margin-top:10px;
        }
    </style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="logo">ZENTRI</div>

    <div>
        <a href="/users">💬 Usuarios</a>
        &nbsp;&nbsp;
        <a class="btn-logout" href="/logout">Cerrar sesión</a>
    </div>
</div>

<!-- CREAR POST -->
<div class="container">

    <div class="card">
        <form method="POST" action="/post" enctype="multipart/form-data">
            <h3>Crear publicación</h3>

            <textarea name="content" placeholder="¿Qué estás pensando?"></textarea>

            <input type="file" name="image">

            <button class="btn comment">Publicar</button>
        </form>
    </div>

    <!-- POSTS -->
    {% for p in posts %}
    <div class="card">

        <p><b>{{ p[1] }}</b></p>
        <p>{{ p[2] }}</p>

        {% if p[3] %}
            <img src="/static/{{ p[3] }}" width="100%">
        {% endif %}

        <p>❤️ {{ p[4] }} likes</p>

        <!-- BOTONES -->
        <a class="btn like" href="/like/{{ p[0] }}">Like</a>
        <a class="btn delete" href="/delete/{{ p[0] }}">Eliminar</a>

        <!-- COMENTARIOS -->
        <form method="POST" action="/comment/{{ p[0] }}">
            <input name="comment" placeholder="Escribe comentario">
            <button class="btn comment">Comentar</button>
        </form>

    </div>
    {% endfor %}

</div>

</body>
</html>
