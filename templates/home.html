<!DOCTYPE html>
<html>
<head>
    <title>ZENTRI - Home</title>
    <style>
        body {
            font-family: Arial;
            background: #e9ebee;
        }

        .header {
            background: #1877f2;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
        }

        .post-box {
            background: white;
            padding: 15px;
            margin: 20px auto;
            width: 500px;
            border-radius: 10px;
        }

        textarea {
            width: 100%;
            height: 60px;
        }

        .btn {
            background: #1877f2;
            color: white;
            border: none;
            padding: 8px;
            margin-top: 5px;
        }

        .post {
            background: white;
            margin: 10px auto;
            width: 500px;
            padding: 15px;
            border-radius: 10px;
        }

        .delete {
            color: red;
            text-decoration: none;
        }

        .like {
            color: #1877f2;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="header">
    ZENTRI - Bienvenido {{ user }}
</div>

<div class="post-box">
    <form action="/post" method="POST" enctype="multipart/form-data">
        <textarea name="content" placeholder="¿Qué estás pensando?"></textarea>
        <input type="file" name="image">
        <button class="btn">Publicar</button>
    </form>
</div>

{% for post in posts %}

<div class="post">
    <b>{{ post[1] }}</b><br>
    {{ post[2] }}<br>

    {% if post[3] %}
        <img src="/static/{{ post[3] }}" width="200">
    {% endif %}

    <br>

    ❤️ {{ post[4] }}

    <a class="like" href="/like/{{ post[0] }}">Like</a>

    <form action="/comment/{{ post[0] }}" method="POST">
        <input name="comment" placeholder="Comentario">
    </form>

    <a class="delete" href="/delete/{{ post[0] }}">Eliminar</a>
</div>

{% endfor %}

</body>
</html>
